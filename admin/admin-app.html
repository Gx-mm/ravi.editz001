<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WBM7P169GP"></script>
  <script>

    <title>App Management | Ravi EDITZ</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS (Reusing existing prompts admin theme) -->
    <link rel="stylesheet" href="admin-prompts.css">

    <style>
        /* Specific layout adjustments for apps table */
        .app-row {
            display: grid;
            grid-template-columns: 80px 2fr 1fr 3fr 1fr 140px;
            gap: 1.5rem;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.2s ease;
            animation: fadeUp 0.4s ease forwards;
            opacity: 0;
        }

        .app-row:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
        }

        .download-link-btn {
            font-size: 0.8rem;
            color: var(--primary-cyan);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .download-link-btn:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .app-row {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                padding: 1.5rem;
            }
            .app-icon { width: 80px; height: 80px; }
            .p-actions { width: 100%; justify-content: flex-end; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-glass); }
        }
    </style>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div>
                <div class="branding">
                    <span class="brand-subtitle">Admin Panel</span>
                    <h1 class="brand-title">Ravi EDITZ</h1>
                </div>
                <h2 class="page-title">App Management</h2>
                <p class="page-desc">Manage all mobile applications, tools & download links.</p>
            </div>
            <button class="btn btn-primary" onclick="openAppModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New App
            </button>
        </header>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="stat-badge">
                Total Apps <strong id="total-count">0</strong>
            </div>
            <div class="filters">
                <input type="text" id="search-input" class="input-glass" placeholder="Search apps..." style="width: 250px;">
                
                <select id="category-filter" class="input-glass">
                    <option value="All">All Categories</option>
                    <option value="Photo Editing">Photo Editing</option>
                    <option value="Video Editing">Video Editing</option>
                    <option value="AI Tools">AI Tools</option>
                    <option value="Presets">Presets</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Other">Other</option>
                </select>

                <select id="sort-filter" class="input-glass">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="az">Name A-Z</option>
                    <option value="za">Name Z-A</option>
                </select>
            </div>
        </div>

        <!-- Apps List -->
        <div id="apps-container" class="prompts-container">
            <div class="loading-state">
                <div class="skeleton" style="height: 80px; width: 100%; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 80px; width: 100%; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 80px; width: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="app-modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Add New App</h3>
                <button class="close-btn" onclick="closeAppModal()">&times;</button>
            </div>
            
            <form id="app-form">
                <!-- Icon Upload Workflow -->
                <div class="form-group">
                    <label>App Icon / Logo</label>
                    <div class="image-upload-row">
                        <div class="image-preview-box" id="icon-preview-box" style="border-radius: 16px;">
                            <span>No Icon</span>
                        </div>
                        <div style="flex: 1;">
                            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                                <input type="file" id="icon-file" class="input-glass" accept="image/jpeg, image/png, image/webp" style="flex: 1;">
                                <button type="button" class="btn btn-secondary" id="btn-get-url">Get URL</button>
                            </div>
                            <input type="url" id="app-icon-url" class="input-glass" placeholder="Icon URL will appear here..." required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>App Name</label>
                    <input type="text" id="app-name" class="input-glass" placeholder="e.g. Lightroom Pro" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="app-category" class="input-glass" required>
                        <option value="" disabled selected>Select category...</option>
                        <option value="Photo Editing">Photo Editing</option>
                        <option value="Video Editing">Video Editing</option>
                        <option value="AI Tools">AI Tools</option>
                        <option value="Presets">Presets</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Download URL</label>
                    <input type="url" id="app-download-url" class="input-glass" placeholder="https://drive.google.com/... or APK link" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="app-description" class="input-glass" placeholder="Describe features, version, and details..." required></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAppModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save">Publish App</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal-overlay">
        <div class="modal delete-modal">
            <div class="modal-header">
                <h3 class="modal-title">Delete App?</h3>
            </div>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">This action cannot be undone. Are you sure you want to delete this application?</p>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete">Delete App</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="key.js"></script>
    <script src="admin-app.js"></script>
</body>
</html>
