<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WBM7P169GP"></script>

    <title>Admin Login | Ravi EDITZ</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin-login.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Ambient Glow Backgrounds -->
    <div class="ambient-glow glow-cyan"></div>
    <div class="ambient-glow glow-purple"></div>

    <div class="layout-container">
        <!-- Left Side: Branding -->
        <div class="branding-panel">
            <div class="badge">
                <span class="dot"></span> SECURE ADMIN ACCESS
            </div>
            <h1 class="brand-title">Ravi EDITZ</h1>
            <p class="brand-subtitle">Admin Panel</p>
        </div>

        <!-- Right Side: Login Card -->
        <div class="login-panel">
            <div class="login-card">
                <div class="card-header">
                    <span class="card-logo">Ravi EDITZ</span>
                    <h2>Welcome Back</h2>
                    <p>Sign in to access the administration panel.</p>
                </div>

                <!-- Error Message Alert -->
                <div id="error-alert" class="error-message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="error-text">Invalid email or password.</span>
                </div>

                <!-- Admin Login Form -->
                <form id="admin-login-form">
                    <div class="input-group">
                        <label for="email">Admin Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" autocomplete="email" placeholder="Enter admin email" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" required>
                            <button type="button" class="toggle-password" id="toggle-password-btn" aria-label="Show password">
                                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="btn-submit">
                        <span id="btn-text">Login to Admin</span>
                        <span id="btn-loader" style="display: none;">Signing in...</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts (Order is important) -->
    <script src="key.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
