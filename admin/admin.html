<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WBM7P169GP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-WBM7P169GP');

    <title>Prompt Management | Ravi EDITZ</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin-prompts.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div>
                <div class="branding">
                    <span class="brand-subtitle">Admin Panel</span>
                    <h1 class="brand-title">Ravi EDITZ</h1>
                </div>
                <h2 class="page-title">Prompt Management</h2>
                <p class="page-desc">Manage all AI prompts published on the platform.</p>
            </div>
            <button class="btn btn-primary" onclick="openPromptModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Prompt
            </button>
        </header>

        <!-- Controls -->
        <div class="controls-bar">
            <div class="stat-badge">
                Total Prompts <strong id="total-count">0</strong>
            </div>
            <div class="filters">
                <input type="text" id="search-input" class="input-glass" placeholder="Search prompts..." style="width: 250px;">
                
                <select id="category-filter" class="input-glass">
                    <option value="All">All Categories</option>
                    <option value="Cinematic">Cinematic</option>
                    <option value="Anime">Anime</option>
                    <option value="Portrait">Portrait</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Trending">Trending</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Cyberpunk">Cyberpunk</option>
                    <option value="AI Art">AI Art</option>
                    <option value="Other">Other</option>
                </select>

                <select id="sort-filter" class="input-glass">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="az">Title A-Z</option>
                    <option value="za">Title Z-A</option>
                </select>
            </div>
        </div>

        <!-- Prompts List -->
        <div id="prompts-container" class="prompts-container">
            <!-- Skeleton Loader -->
            <div class="loading-state">
                <div class="skeleton" style="height: 80px; width: 100%; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 80px; width: 100%; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 80px; width: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Prompt Modal -->
    <div class="modal-overlay" id="prompt-modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Add New Prompt</h3>
                <button class="close-btn" onclick="closePromptModal()">&times;</button>
            </div>
            
            <form id="prompt-form">
                <div class="form-group">
                    <label>Prompt Image</label>
                    <div class="image-upload-row">
                        <div class="image-preview-box" id="image-preview-box">
                            <span>No Image</span>
                        </div>
                        <div style="flex: 1;">
                            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                                <input type="file" id="image-file" class="input-glass" accept="image/jpeg, image/png, image/webp" style="flex: 1;">
                                <button type="button" class="btn btn-secondary" id="btn-get-url">Get URL</button>
                            </div>
                            <input type="url" id="prompt-image-url" class="input-glass" placeholder="Image URL will appear here..." required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="prompt-title" class="input-glass" placeholder="e.g. Cinematic Cyberpunk Cityscape" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="prompt-category" class="input-glass" required>
                        <option value="" disabled selected>Select a category...</option>
                        <option value="Cinematic">Cinematic</option>
                        <option value="Anime">Anime</option>
                        <option value="Portrait">Portrait</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Trending">Trending</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Cyberpunk">Cyberpunk</option>
                        <option value="AI Art">AI Art</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Prompt Text</label>
                    <textarea id="prompt-text" class="input-glass" placeholder="Enter the full AI prompt here..." required></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closePromptModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save">Publish Prompt</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="delete-modal-overlay">
        <div class="modal delete-modal">
            <div class="modal-header">
                <h3 class="modal-title">Delete Prompt?</h3>
            </div>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">This action cannot be undone. Are you sure you want to delete this prompt?</p>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete">Delete Prompt</button>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts (Order is important) -->
    <script src="key.js"></script>
    <script src="admin-prompts.js"></script>
</body>
</html>
