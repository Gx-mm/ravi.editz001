<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ravi EDITZ - Explore Prompts</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Space Grotesk',sans-serif;
      background:#050816;
      color:white;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;
      width:700px;
      height:700px;
      background:radial-gradient(circle,#8b5cf633,transparent 70%);
      top:-250px;
      left:-250px;
      z-index:-1;
      animation:float1 8s ease-in-out infinite alternate;
    }

    body::after{
      content:'';
      position:fixed;
      width:700px;
      height:700px;
      background:radial-gradient(circle,#06b6d433,transparent 70%);
      bottom:-250px;
      right:-250px;
      z-index:-1;
      animation:float2 10s ease-in-out infinite alternate;
    }

    @keyframes float1{
      from{transform:translateY(0);}
      to{transform:translateY(70px);}
    }

    @keyframes float2{
      from{transform:translateX(0);}
      to{transform:translateX(-70px);}
    }

    nav{
      position:sticky;
      top:0;
      z-index:999;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      backdrop-filter:blur(18px);
      background:rgba(255,255,255,0.05);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .logo{
      font-size:30px;
      font-weight:700;
      background:linear-gradient(90deg,#8b5cf6,#06b6d4);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .nav-links{
      display:flex;
      gap:25px;
    }

    .nav-links a{
      color:#d1d5db;
      text-decoration:none;
      transition:0.3s;
    }

    .nav-links a:hover{
      color:white;
    }

    .hero{
      text-align:center;
      padding:100px 8% 40px;
    }

    .hero h1{
      font-size:68px;
      margin-bottom:20px;
      line-height:1.1;
      background:linear-gradient(90deg,#ffffff,#8b5cf6,#06b6d4);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:fadeUp 1s ease;
    }

    .hero p{
      color:#9ca3af;
      max-width:800px;
      margin:auto;
      line-height:1.8;
      font-size:18px;
      animation:fadeUp 1.4s ease;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(50px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .top-bar{
      padding:20px 8% 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;
    }

    .trending-badge{
      padding:12px 22px;
      border-radius:999px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(14px);
      color:#00f0ff;
      font-weight:600;
      box-shadow:0 0 20px rgba(0,240,255,0.18);
    }

    /* Category Filter Buttons */
    .category-filters{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .filter-btn{
      padding:8px 18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.03);
      color:#d1d5db;
      cursor:pointer;
      font-family:'Space Grotesk',sans-serif;
      font-size:14px;
      transition:0.3s;
    }

    .filter-btn:hover, .filter-btn.active{
      background:linear-gradient(90deg,#8b5cf6,#06b6d4);
      color:white;
      border-color:transparent;
      box-shadow:0 0 15px rgba(139,92,246,0.3);
    }

    .prompt-grid{
      padding:10px 8% 60px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:35px;
      min-height:300px;
    }

    .prompt-card{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:26px;
      overflow:hidden;
      backdrop-filter:blur(20px);
      transition:0.45s;
      display:flex;
      flex-direction:column;
    }

    .prompt-card:hover{
      transform:translateY(-12px) scale(1.02);
      border-color:#8b5cf6;
      box-shadow:0 0 45px rgba(139,92,246,0.25);
    }

    .prompt-card img{
      width:100%;
      height:280px;
      object-fit:cover;
      background:#0b0f19;
    }

    .card-content{
      padding:24px;
      display:flex;
      flex-direction:column;
      flex-grow:1;
    }

    .badge{
      display:inline-block;
      padding:6px 14px;
      border-radius:999px;
      background:rgba(139,92,246,0.18);
      border:1px solid rgba(139,92,246,0.35);
      color:#c4b5fd;
      font-size:13px;
      margin-bottom:16px;
      width:fit-content;
    }

    .card-content h3{
      font-size:22px;
      margin-bottom:14px;
      line-height:1.3;
    }

    .prompt-text{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:18px;
      padding:18px;
      color:#d1d5db;
      line-height:1.7;
      font-size:15px;
      margin-bottom:20px;
      max-height:180px;
      overflow:auto;
      white-space:pre-wrap;
      word-break:break-word;
      flex-grow:1;
    }

    .copy-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:linear-gradient(90deg,#8b5cf6,#06b6d4);
      color:white;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:0.4s;
    }

    .copy-btn:hover{
      transform:translateY(-4px);
      box-shadow:0 0 35px rgba(139,92,246,0.55);
    }

    .action-container{
      text-align:center;
      padding-bottom:100px;
    }

    .collection-btn{
      padding:18px 42px;
      border:none;
      border-radius:18px;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
      transition:0.4s;
      background:linear-gradient(90deg,#ff0080,#8b5cf6);
      color:white;
      box-shadow:0 0 35px rgba(255,0,128,0.25);
    }

    .collection-btn:hover{
      transform:translateY(-5px) scale(1.03);
      box-shadow:0 0 45px rgba(255,0,128,0.45);
    }

    .loading-text, .empty-text{
      grid-column:1 / -1;
      text-align:center;
      color:#9ca3af;
      font-size:18px;
      padding:60px 0;
    }

    footer{
      padding:50px 8%;
      text-align:center;
      border-top:1px solid rgba(255,255,255,0.08);
      color:#9ca3af;
      background:rgba(255,255,255,0.03);
    }

    @media(max-width:768px){
      .hero h1{
        font-size:40px;
      }
      .nav-links{
        display:none;
      }
      .top-bar{
        flex-direction:column;
        align-items:flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">Ravi EDITZ</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="collection.html">Explore</a>
      <a href="trd.html">Trending</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <h1>Explore Trending AI Prompts</h1>
    <p>
      Discover cinematic AI prompts, anime edits,
      futuristic portraits, and Instagram viral transformations.
    </p>
  </section>

  <!-- Top Bar & Category Filters -->
  <div class="top-bar">
    <div class="trending-badge">🔥 Top Viral Prompts This Week</div>
    
    <div class="category-filters" id="filters-container">
      <button class="filter-btn active" onclick="filterCategory('All')">All</button>

      <button class="filter-btn" onclick="filterCategory('Trending')">Trending</button>
    </div>
  </div>

  <!-- Dynamic Prompts Grid -->
  <section class="prompt-grid" id="prompt-grid">
    <div class="loading-text">Loading trending prompts...</div>
  </section>

  <!-- Collection Button -->
  <div class="action-container">
    <a href="ex.html">
      <button class="collection-btn">
       Explore Prompt Collections
      </button>
    </a>
  </div>

  <!-- Footer -->
  <footer>
    Ravi EDITZ • Premium AI Prompt Gallery
  </footer>

  <!-- Supabase Credentials -->
  <script src="key.js"></script>

  <script>
    // Initialize Supabase Client
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let allPrompts = [];
    let selectedCategory = 'All';

    // 1. Fetch Prompts from Supabase
    async function loadPrompts() {
      const grid = document.getElementById('prompt-grid');

      try {
        const { data, error } = await supabaseClient
          .from('prompts')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        allPrompts = data || [];
        renderPrompts();
      } catch (err) {
        console.error('Fetch Error:', err);
        grid.innerHTML = '<div class="empty-text">Unable to load prompts at the moment. Please try again later.</div>';
      }
    }

    // 2. Render Cards in HTML
    function renderPrompts() {
      const grid = document.getElementById('prompt-grid');

      const filtered = selectedCategory === 'All' 
        ? allPrompts 
        : allPrompts.filter(p => (p.category || '').toLowerCase() === selectedCategory.toLowerCase());

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-text">No prompts found in this category.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="prompt-card">
          <img src="${item.image_url || 't/1.png'}" alt="${escapeHtml(item.title || 'AI Prompt')}" onerror="this.src='t/1.png'">
          <div class="card-content">
            <span class="badge">${escapeHtml(item.category || 'AI Prompt')}</span>
            <h3>${escapeHtml(item.title || 'Untitled Prompt')}</h3>
            <div class="prompt-text" id="prompt-${item.id}">${escapeHtml(item.prompt_text || '')}</div>
            <button class="copy-btn" onclick="copyPrompt('prompt-${item.id}', this)">
              Copy Prompt
            </button>
          </div>
        </div>
      `).join('');
    }

    // 3. Category Filter Trigger
    function filterCategory(category) {
      selectedCategory = category;

      // Update active filter button state
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        if (btn.innerText.trim().toLowerCase() === category.toLowerCase()) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderPrompts();
    }

    // 4. Copy Prompt to Clipboard
    function copyPrompt(id, button) {
      const el = document.getElementById(id);
      if (!el) return;

      const text = el.innerText;
      navigator.clipboard.writeText(text).then(() => {
        button.innerText = "Copied ✓";
        setTimeout(() => {
          button.innerText = "Copy Prompt";
        }, 2000);
      }).catch(err => {
        console.error("Clipboard Error:", err);
      });
    }

    // Helper: Prevent HTML Injection issues
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Load data on page launch
    document.addEventListener('DOMContentLoaded', loadPrompts);
  </script>

</body>
</html>
